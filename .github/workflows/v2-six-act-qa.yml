name: V2 complete six-act story — pre-release browser QA

on:
  push:
    branches: [v2-complete-six-act-story]
    paths:
      - 'index.html'
      - 'tests/v2-six-act.spec.cjs'
      - 'tests/v2-main.spec.cjs'
      - '.github/workflows/v2-six-act-qa.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'tests/v2-six-act.spec.cjs'
      - '.github/workflows/v2-six-act-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  six-act:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Use system Chrome or install Playwright Chromium
        shell: bash
        run: |
          BINARY="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -n "$BINARY" ]; then
            echo "CHROME_BINARY=$BINARY" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Test existing story, new six acts and preserved V1.5.1 research
        run: npx playwright test tests/v2-main.spec.cjs tests/v2-six-act.spec.cjs tests/browser-smoke.spec.cjs
      - name: Preserve diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v2-six-act-failure-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
