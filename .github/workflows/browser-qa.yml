name: Cost of Courtesy — browser QA

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'tests/**'
      - 'package.json'
      - 'playwright.config.cjs'
      - '.github/workflows/browser-qa.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'tests/**'
      - 'package.json'
      - 'playwright.config.cjs'
      - '.github/workflows/browser-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test tooling
        run: npm install --no-audit --no-fund
      - name: Install Chromium and OS dependencies
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile Chromium regressions
        run: npx playwright test
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa-failure-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
