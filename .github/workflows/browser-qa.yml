name: Cost of Courtesy — browser QA

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'archive/v1.5.1/index.html'
      - 'tests/**'
      - 'package.json'
      - 'playwright.config.cjs'
      - '.github/workflows/browser-qa.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'archive/v1.5.1/index.html'
      - 'tests/**'
      - 'package.json'
      - 'playwright.config.cjs'
      - '.github/workflows/browser-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test tooling
        run: npm install --no-audit --no-fund
      - name: Use preinstalled Chrome or install Playwright Chromium
        shell: bash
        run: |
          BINARY="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -n "$BINARY" ]; then
            echo "CHROME_BINARY=$BINARY" >> "$GITHUB_ENV"
            echo "Using system browser: $BINARY"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Run homepage and preserved research regressions on desktop/mobile
        run: npx playwright test tests/v2-main.spec.cjs tests/browser-smoke.spec.cjs
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa-failure-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
