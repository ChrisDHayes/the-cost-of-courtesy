name: Verify Story-First GitHub Pages deployment

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'story-six-act.css'
      - 'story-six-act.js'
      - 'archive/v1.5.1/index.html'
      - 'tests/live-pages.spec.cjs'
      - 'playwright.live.config.cjs'
      - '.github/workflows/live-pages-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify published V2 and preserved research archive are publicly served
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, time, urllib.request, urllib.error, sys
          root='https://chrisdhayes.github.io/the-cost-of-courtesy/'
          assets=[
            ('index.html',root,(b'Christopher Hayes',b'window.COURTESY_V2_DATA',b'wealth-management dealer',b'id="implications-title"',b'id="choice"',b'id="footprint"')),
            ('story-six-act.css',root+'story-six-act.css',(b'.scene.story-addition',b'.ending-option')),
            ('story-six-act.js',root+'story-six-act.js',(b'CourtesySixActQA',b'changeEnding')),
            ('archive/v1.5.1/index.html',root+'archive/v1.5.1/',(b'CourtesyLanguage122',b'courtesy-response-matrix',b'language-energy-matrix'))
          ]
          for path,url,required in assets:
            expected=pathlib.Path(path).read_bytes()
            ok=False
            for attempt in range(1,16):
              try:
                req=urllib.request.Request(url,headers={'User-Agent':'Courtesy-Story-First-Deployment-QA','Cache-Control':'no-cache'})
                with urllib.request.urlopen(req,timeout=25) as response:
                  status=response.status;got=response.read()
                missing=[b.decode() for b in required if b not in got]
                correct=(status==200 and got==expected and not missing)
                print(path,'attempt',attempt,'HTTP',status,'bytes',len(got),'sha256',hashlib.sha256(got).hexdigest(),'matched',correct,'missing',missing,flush=True)
                if correct:ok=True;break
              except (urllib.error.HTTPError,urllib.error.URLError) as e:
                print(path,'attempt',attempt,'error',str(e),flush=True)
              if attempt<15:time.sleep(10)
            if not ok:sys.exit('PAGES_PARITY_FAILED: '+path)
          print('LIVE_V2_AND_ARCHIVE_MATCH_SOURCE',flush=True)
          PY
      - name: Install browser tests
        run: npm install --no-audit --no-fund
      - name: Use system Chrome if available
        shell: bash
        run: |
          BINARY="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -n "$BINARY" ]; then
            echo "CHROME_BINARY=$BINARY" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Exercise published story-first site and preserved full research edition
        run: npx playwright test -c playwright.live.config.cjs
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: story-first-live-qa-failures
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
