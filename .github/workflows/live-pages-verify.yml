name: Verify live GitHub Pages deployment

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'tests/live-pages.spec.cjs'
      - 'playwright.live.config.cjs'
      - '.github/workflows/live-pages-verify.yml'
  pull_request:
    paths:
      - 'tests/live-pages.spec.cjs'
      - 'playwright.live.config.cjs'
      - '.github/workflows/live-pages-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-pages:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify public HTTP delivery and deployed HTML matches the checked-in release
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, time, urllib.request, urllib.error, sys
          url = "https://chrisdhayes.github.io/the-cost-of-courtesy/"
          source = pathlib.Path("index.html").read_bytes()
          print("Main-branch index SHA256:", hashlib.sha256(source).hexdigest(), flush=True)
          for attempt in range(1,4):
              try:
                  request=urllib.request.Request(url, headers={"User-Agent":"Cost-of-Courtesy-Live-Verification/1.0","Cache-Control":"no-cache"})
                  with urllib.request.urlopen(request, timeout=30) as r:
                      status=r.status
                      content=r.read()
                      final=r.geturl()
                  print("Pages URL:",final,"HTTP:",status,"bytes:",len(content),flush=True)
                  print("Deployed index SHA256:",hashlib.sha256(content).hexdigest(),flush=True)
                  required=(b"courtesy-response-matrix",b"language-energy-matrix",b"language122Data",b"revealExploreDeepLink")
                  missing=[m.decode() for m in required if m not in content]
                  if missing:
                      sys.exit("PAGES_CONTENT_MISSING: "+", ".join(missing))
                  if content != source:
                      sys.exit("PAGES_SOURCE_MISMATCH: live index.html differs from checked-in index.html; verify Pages deployment source and latest build")
                  print("PAGES_MATCH: deployed HTML byte-for-byte matches checked-in V1.5.1 release.",flush=True)
                  break
              except urllib.error.HTTPError as e:
                  print("PAGES_HTTP_ERROR:",e.code, "on attempt",attempt, flush=True)
                  if attempt==3: raise
              except urllib.error.URLError as e:
                  print("PAGES_NETWORK_ERROR:",e, "on attempt",attempt, flush=True)
                  if attempt==3: raise
              time.sleep(5)
          PY
      - name: Install test tooling
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test published Pages in desktop and mobile Chromium
        run: npx playwright test -c playwright.live.config.cjs
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-pages-verification-failures
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
