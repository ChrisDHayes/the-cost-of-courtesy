name: Courtesy — editorial, mobile and source QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'story-six-act.js'
      - 'story-six-act.css'
      - 'tests/v2-editorial.spec.cjs'
      - '.github/workflows/courtesy_browser_qa.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'story-six-act.js'
      - 'story-six-act.css'
      - 'tests/v2-editorial.spec.cjs'
      - '.github/workflows/courtesy_browser_qa.yml'

permissions:
  contents: read

jobs:
  editorial-regression:
    name: Story hierarchy, evidence disclosure and narrow-screen QA
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the repository test dependencies
        run: npm install --no-audit --no-fund
      - name: Use system Chrome or install Playwright Chromium
        shell: bash
        run: |
          BINARY="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -n "$BINARY" ]; then
            echo "CHROME_BINARY=$BINARY" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Run six-act editorial and narrow-phone checks
        run: npx playwright test tests/v2-editorial.spec.cjs
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: courtesy-editorial-QA-failures
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
