name: V2 prototype quick browser check

on:
  push:
    branches: [v2-story-first-prototypes]
    paths:
      - 'tests/v2-prototype.spec.cjs'
      - 'prototypes/v2-story-first/**'
      - 'playwright.v2.system.config.cjs'
      - '.github/workflows/v2-prototype-fast-qa.yml'
  pull_request:
    paths:
      - 'tests/v2-prototype.spec.cjs'
      - 'prototypes/v2-story-first/**'
      - 'playwright.v2.system.config.cjs'
      - '.github/workflows/v2-prototype-fast-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install JavaScript test dependencies
        run: npm install --no-audit --no-fund
      - name: Select system Chrome if available
        shell: bash
        run: |
          BINARY="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -n "$BINARY" ]; then
            echo "CHROME_BINARY=$BINARY" >> "$GITHUB_ENV"
            echo "Using preinstalled browser: $BINARY"
          else
            echo "No system Chrome: installing Playwright Chromium"
            npx playwright install --with-deps chromium
          fi
      - name: Validate V2 design slices
        run: npx playwright test tests/v2-prototype.spec.cjs -c playwright.v2.system.config.cjs
